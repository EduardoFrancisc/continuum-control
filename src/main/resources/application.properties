spring.application.name=continuum-control

# Configuração de conexão com o PostgreSQL do Docker
#Substituir a url por 'jdbc:postgresql://postgres:5432/postgres' quando subir no docker
spring.datasource.url=jdbc:postgresql://postgres:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# Dialeto do PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

#Mongo
#Substituir a url por 'mongodb://admin:123456@mongodb:27017/continuum?authSource=admin' quando subir no docker
spring.mongodb.uri=mongodb://admin:123456@mongodb:27017/continuum?authSource=admin

spring.jpa.hibernate.ddl-auto=validate

# A inicialização do banco é gerenciada nativamente pelo Docker (/docker-entrypoint-initdb.d/)
spring.sql.init.mode=never

#spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=create
#spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=src/main/resources/schema.sql

api.secret.token.secret=${JWT_SECRET:my-secret-key}

#para expor os endpoints de monitoramento
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always