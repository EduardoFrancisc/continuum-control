#  docker compose down -v
#  docker compose up --build -d

services:
  postgres:
    image: postgres:16
    container_name: postgres-cc
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../src/main/resources/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro

  mongodb:
    image: mongo:8
    container_name: mongo-cc
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: "123456"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

  app:
    build: .
    container_name: continuum-control
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - mongodb

volumes:
  postgres_data:
  mongodb_data: